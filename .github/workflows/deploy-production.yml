name: Deploy Production

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu Docker server
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
    steps:
      - name: Configure trusted SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and deploy the verified main branch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          escaped_path=$(printf '%q' "$DEPLOY_PATH")
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH=${escaped_path} bash -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main
          docker compose --env-file .env.production up -d --build --remove-orphans
          docker compose --env-file .env.production ps
          curl --fail --show-error --silent --retry 6 --retry-delay 5 http://127.0.0.1/api/health
          REMOTE
