name: sheerwood-admission-portal

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /data/sheerwood.db
    volumes:
      - api-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI}
        VITE_COGNITO_LOGOUT_URI: ${VITE_COGNITO_LOGOUT_URI}
        VITE_COGNITO_SCOPES: ${VITE_COGNITO_SCOPES}
        VITE_COGNITO_ROLE_CLAIM: ${VITE_COGNITO_ROLE_CLAIM}
        VITE_COGNITO_DEFAULT_ROLE: ${VITE_COGNITO_DEFAULT_ROLE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  api-data:
  caddy-data:
  caddy-config:
